<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">DAOS memory model</title>
  <desc id="desc">Diagram showing DAOS memory layers flowing from local thread to hot cache, agent continuity, durable wiki/docs memory, and live reality verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08111f" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="continuity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="durable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="reality" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #e2e8f0; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #94a3b8; }
      .label { font: 700 22px Inter, Arial, sans-serif; fill: #f8fafc; }
      .body { font: 400 16px Inter, Arial, sans-serif; fill: #dbeafe; }
      .small { font: 400 15px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .callout { font: 600 18px Inter, Arial, sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)" />
  <g opacity="0.12">
    <path d="M0 40 H1280 M0 120 H1280 M0 200 H1280 M0 280 H1280 M0 360 H1280 M0 440 H1280 M0 520 H1280 M0 600 H1280 M0 680 H1280" stroke="#334155" stroke-width="1"/>
    <path d="M80 0 V760 M240 0 V760 M400 0 V760 M560 0 V760 M720 0 V760 M880 0 V760 M1040 0 V760 M1200 0 V760" stroke="#334155" stroke-width="1"/>
  </g>

  <text x="70" y="78" class="title">DAOS memory model</text>
  <text x="70" y="112" class="subtitle">Keep the exact thread, the shared front door, the durable wiki, and live reality separate.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" rx="18" ry="18" width="240" height="170" fill="url(#thread)" />
    <text x="100" y="218" class="label">1. Local thread</text>
    <text x="100" y="252" class="body">Exact handoff point.</text>
    <text x="100" y="282" class="small">• current message</text>
    <text x="100" y="306" class="small">• reply target</text>
    <text x="100" y="330" class="small">• recent turns</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="170" rx="18" ry="18" width="240" height="170" fill="url(#cache)" />
    <text x="400" y="218" class="label">2. Hot cache</text>
    <text x="400" y="252" class="body">Shared front door.</text>
    <text x="400" y="282" class="small">• current focus</text>
    <text x="400" y="306" class="small">• major corrections</text>
    <text x="400" y="330" class="small">• active risks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="670" y="170" rx="18" ry="18" width="240" height="170" fill="url(#continuity)" />
    <text x="700" y="218" class="label">3. Agent continuity</text>
    <text x="700" y="252" class="body">One agent’s resume note.</text>
    <text x="700" y="282" class="small">• what it was doing</text>
    <text x="700" y="306" class="small">• what to verify next</text>
    <text x="700" y="330" class="small">• not a hidden work log</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="170" rx="18" ry="18" width="240" height="170" fill="url(#durable)" />
    <text x="1000" y="218" class="label">4. Durable wiki/docs</text>
    <text x="1000" y="252" class="body">Shared long-lived memory.</text>
    <text x="1000" y="282" class="small">• decisions</text>
    <text x="1000" y="306" class="small">• synthesized findings</text>
    <text x="1000" y="330" class="small">• reusable methods</text>
  </g>

  <path d="M310 255 H360" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M610 255 H660" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M910 255 H960" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="210" y="445" rx="22" ry="22" width="860" height="170" fill="url(#reality)" />
    <text x="250" y="500" class="label">5. Live reality verification</text>
    <text x="250" y="536" class="body">When correctness depends on freshness, memory stops here and live checking begins.</text>
    <text x="250" y="574" class="small">repo files • configs • runtime state • logs • inboxes • calendars • external systems</text>
  </g>

  <path d="M190 342 C190 410, 260 430, 330 430" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" fill="none" opacity="0.9"/>
  <path d="M490 342 C490 410, 490 430, 490 430" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" fill="none" opacity="0.9"/>
  <path d="M790 342 C790 410, 720 430, 650 430" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" fill="none" opacity="0.9"/>
  <path d="M1090 342 C1090 410, 1020 430, 950 430" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" fill="none" opacity="0.9"/>

  <g>
    <rect x="70" y="660" rx="14" ry="14" width="1140" height="58" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="98" y="697" class="callout">Rule of thumb: thread first for exact continuity, wiki for durable truth, live checks for anything freshness-sensitive.</text>
  </g>
</svg>
