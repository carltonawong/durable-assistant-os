name: DAOS enforcement gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test, package, and trust gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: npm wrapper gate
        run: npm run test:wrapper

      - name: npm package payload gate
        run: npm run test:package

      - name: packed install smoke gate
        run: npm run test:pack-install

      - name: release/front-door consistency gate
        run: npm run test:release-front-door

      - name: npm package dry-run audit
        run: npm pack --dry-run --json
